# Static analysis for Wavvy: the recommended Flutter lints plus a few that
# catch real mistakes in async and stream code.
analyzer:
  exclude:
    - build/**
    - android/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # A dropped future hides its errors; use unawaited() when it is deliberate.
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
